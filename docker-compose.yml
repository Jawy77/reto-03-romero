# Un comando levanta front y backend:  docker compose up --build
services:
  agente:
    build: .
    ports:
      - "${PUERTO_PUBLICO:-3000}:3000"
    env_file:
      - path: .env
        required: false
    # Las claves también pueden llegar del entorno del host (por ejemplo, leídas de un
    # gestor de secretos al arrancar); si están definidas, tienen prioridad sobre .env.
    environment:
      - KIMI_API_KEY
      - ANTHROPIC_API_KEY
    volumes:
      - salida:/app/out
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  salida:
